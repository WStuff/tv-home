name: Feature request
description: Suggest an improvement that fits TV Home
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, and who does it affect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the remote interaction and expected result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: fit
    attributes:
      label: Product fit
      options:
        - label: This can work offline and without advertising or analytics.
          required: true
        - label: This can be operated with a TV remote and does not require touch.
          required: true
