name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: Unit tests, lint and release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Check installation-script safety
        run: python3 -m unittest tests.test_launcher_handover -v
      - name: Build and verify
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Check APK size
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KiB"
          test "$size" -lt 12582912 || { echo "APK exceeds the 12 MiB release limit"; exit 1; }
      - name: Upload test-only APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Home-ci-debug-signed-do-not-publish
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
