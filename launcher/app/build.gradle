plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        // A neutral default keeps this build independent from any one person's TV setup.
        // Public forks should override it with -PlauncherApplicationId=their.own.id.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.tvhome.launcher')
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    def releaseStoreFile = providers.gradleProperty('releaseStoreFile').orNull
    def releaseStorePassword = providers.gradleProperty('releaseStorePassword').orNull
    def releaseKeyAlias = providers.gradleProperty('releaseKeyAlias').orNull
    def releaseKeyPassword = providers.gradleProperty('releaseKeyPassword').orNull

    signingConfigs {
        if (releaseStoreFile != null) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Local builds stay installable. Public GitHub releases provide an upload keystore via
            // Gradle properties, never a key committed to this repository.
            signingConfig releaseStoreFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
